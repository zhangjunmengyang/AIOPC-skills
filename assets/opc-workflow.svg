    <rect x="396" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="471" y="1084" text-anchor="middle" class="ink" font-size="13">代码 / 产品</text>
    <rect x="558" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="633" y="1084" text-anchor="middle" class="ink" font-size="13">案例 / 证言</text>
    <rect x="720" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="795" y="1084" text-anchor="middle" class="ink" font-size="13">合作关系</text>
    <rect x="882" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="957" y="1084" text-anchor="middle" class="ink" font-size="13">品牌 / 域名</text>
    <rect x="1044" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="1119" y="1084" text-anchor="middle" class="ink" font-size="13">SOP / 模板</text>
    <rect x="1206" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="1281" y="1084" text-anchor="middle" class="ink" font-size="13">个人声誉</text>
  </g>

  <!-- footer -->
  <line x1="72" y1="1138" x2="1528" y2="1138" class="hair"/>
  <text x="72" y="1166" class="mono muted" font-size="11" letter-spacing="1">OPC WORKFLOW · 12 STAGES / 3 ROUTES / 3 LOOPS</text>
  <text x="1528" y="1166" text-anchor="end" class="mono muted" font-size="11">github.com/zhangjunmengyang/AIOPC-skills</text>
</svg>
