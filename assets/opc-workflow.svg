<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1D1B18" opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1B18"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9552F"/>
    </marker>
    <style>
      .ink { fill:#1D1B18; }
      .muted { fill:#6E655A; }
      .paper { fill:#F7F2E8; }
      .card { fill:#FBF7EF; stroke:#D8CCB8; stroke-width:1; }
      .line { stroke:#1D1B18; stroke-width:1.1; fill:none; }
      .hair { stroke:#CFC3B2; stroke-width:1; fill:none; }
      .cn { font-family:'PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif; }
      .mono { font-family:'SF Mono',Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect width="1600" height="1200" class="paper"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>

  <!-- header -->
  <text x="72" y="70" class="mono muted" font-size="13" letter-spacing="3">ONE-PERSON COMPANY · FIELD GUIDE</text>
  <text x="72" y="138" class="cn ink" font-size="58" font-weight="700" letter-spacing="-1">一人公司全流程</text>
  <text x="72" y="178" class="cn muted" font-size="19">从盘点自己到资产化：12 个阶段，3 条路线，3 个循环</text>
  <line x1="72" y1="202" x2="1528" y2="202" class="hair"/>

  <!-- section 01 -->
  <text x="72" y="236" class="mono muted" font-size="12" letter-spacing="2">01 / 主流程</text>

  <!-- row 1 cards -->
  <g class="cn">
    <!-- card 1 -->
    <rect x="72" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="88" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="103" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">1</text>
    <text x="128" y="287" class="ink" font-size="19" font-weight="700">选题</text>
    <text x="88" y="330" class="muted" font-size="12.5">问题库 · 六维评分 · 赛道</text>

    <!-- card 2 -->
    <rect x="320" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="336" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="351" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">2</text>
    <text x="376" y="287" class="ink" font-size="19" font-weight="700">验证</text>
    <text x="336" y="330" class="muted" font-size="12.5">访谈 · 预售 · 人工交付</text>

    <!-- card 3 -->
    <rect x="568" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="584" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="599" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">3</text>
    <text x="624" y="287" class="ink" font-size="19" font-weight="700">产品</text>
    <text x="584" y="330" class="muted" font-size="12.5">PRD · MVP · 验收</text>

    <!-- card 4 -->
    <rect x="816" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="832" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="847" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">4</text>
    <text x="872" y="287" class="ink" font-size="19" font-weight="700">设计</text>
    <text x="832" y="330" class="muted" font-size="12.5">风格 · 系统 · 页面</text>

    <!-- card 5 -->
    <rect x="1064" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="1080" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="1095" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">5</text>
    <text x="1120" y="287" class="ink" font-size="19" font-weight="700">搭建</text>
    <text x="1080" y="330" class="muted" font-size="12.5">开发 · 支付 · 部署</text>

    <!-- card 6 -->
    <rect x="1312" y="254" width="232" height="104" rx="4" class="card"/>
    <rect x="1328" y="270" width="30" height="22" rx="3" fill="#1D1B18"/>
    <text x="1343" y="286" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">6</text>
    <text x="1368" y="287" class="ink" font-size="19" font-weight="700">上线</text>
    <text x="1328" y="330" class="muted" font-size="12.5">商店 · 官网 · 审核</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="304" y1="306" x2="316" y2="306" class="line" marker-end="url(#arrow)"/>
  <line x1="552" y1="306" x2="564" y2="306" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="306" x2="812" y2="306" class="line" marker-end="url(#arrow)"/>
  <line x1="1048" y1="306" x2="1060" y2="306" class="line" marker-end="url(#arrow)"/>
  <line x1="1296" y1="306" x2="1308" y2="306" class="line" marker-end="url(#arrow)"/>

  <!-- snake connector 6 -> 7 -->
  <path d="M 1428 358 L 1428 388" class="line" marker-end="url(#arrow)"/>

  <!-- row 2 cards (right to left) -->
  <g class="cn">
    <!-- card 7 at x=1312 -->
    <rect x="1312" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="1328" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="1343" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">7</text>
    <text x="1368" y="425" class="ink" font-size="19" font-weight="700">获客</text>
    <text x="1328" y="468" class="muted" font-size="12.5">内容 · SEO/GEO · 社媒</text>

    <!-- card 8 at x=1064 -->
    <rect x="1064" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="1080" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="1095" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">8</text>
    <text x="1120" y="425" class="ink" font-size="19" font-weight="700">销售</text>
    <text x="1080" y="468" class="muted" font-size="12.5">外联 · 演示 · 报价</text>

    <!-- card 9 at x=816 -->
    <rect x="816" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="832" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="847" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">9</text>
    <text x="872" y="425" class="ink" font-size="19" font-weight="700">交付</text>
    <text x="832" y="468" class="muted" font-size="12.5">SOP · onboarding · 验收</text>

    <!-- card 10 at x=568 -->
    <rect x="568" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="584" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="599" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">10</text>
    <text x="624" y="425" class="ink" font-size="19" font-weight="700">留存</text>
    <text x="584" y="468" class="muted" font-size="12.5">支持 · 复购 · 社群</text>

    <!-- card 11 at x=320 -->
    <rect x="320" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="336" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="351" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">11</text>
    <text x="376" y="425" class="ink" font-size="19" font-weight="700">经营</text>
    <text x="336" y="468" class="muted" font-size="12.5">财务 · 法务 · 税务</text>

    <!-- card 12 at x=72 -->
    <rect x="72" y="392" width="232" height="104" rx="4" class="card"/>
    <rect x="88" y="408" width="30" height="22" rx="3" fill="#D9552F"/>
    <text x="103" y="424" text-anchor="middle" fill="#F7F2E8" font-size="12" font-weight="700">12</text>
    <text x="128" y="425" class="ink" font-size="19" font-weight="700">资产化</text>
    <text x="88" y="468" class="muted" font-size="12.5">内容 · 受众 · 代码</text>
  </g>

  <!-- arrows row 2 right to left -->
  <line x1="1308" y1="444" x2="1296" y2="444" class="line" marker-end="url(#arrow)"/>
  <line x1="1060" y1="444" x2="1048" y2="444" class="line" marker-end="url(#arrow)"/>
  <line x1="812" y1="444" x2="800" y2="444" class="line" marker-end="url(#arrow)"/>
  <line x1="564" y1="444" x2="552" y2="444" class="line" marker-end="url(#arrow)"/>
  <line x1="316" y1="444" x2="304" y2="444" class="line" marker-end="url(#arrow)"/>

  <!-- foundation bar -->
  <rect x="72" y="524" width="1472" height="58" rx="4" fill="#EFE7D8" stroke="#D8CCB8"/>
  <text x="92" y="559" class="cn ink" font-size="15" font-weight="700">0 盘点自己</text>
  <text x="192" y="559" class="cn muted" font-size="14">时间 · 现金 · 技能 · 关系 · 风险底线 —— 所有阶段的地基</text>

  <!-- section 02 routes -->
  <text x="72" y="626" class="mono muted" font-size="12" letter-spacing="2">02 / 三条路线</text>

  <!-- route cards -->
  <g class="cn">
    <rect x="72" y="644" width="472" height="140" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <rect x="72" y="644" width="472" height="4" fill="#D9552F"/>
    <text x="92" y="678" class="ink" font-size="20" font-weight="700">2C 独立 App</text>
    <text x="92" y="704" class="muted" font-size="12.5">商店 · ASO · 订阅 · 留存</text>
    <text x="92" y="732" class="ink" font-size="13">先找付费需求</text>
    <text x="92" y="752" class="ink" font-size="13">商店页就是落地页</text>
    <text x="92" y="772" class="muted" font-size="12.5">订阅 / 内购 / 广告；留存决定生死</text>

    <rect x="564" y="644" width="472" height="140" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <rect x="564" y="644" width="472" height="4" fill="#2E6F6A"/>
    <text x="584" y="678" class="ink" font-size="20" font-weight="700">2B 服务 / 产品</text>
    <text x="584" y="704" class="muted" font-size="12.5">ICP · 外联 · 试点 · 续费</text>
    <text x="584" y="732" class="ink" font-size="13">先找付款者，不只使用者</text>
    <text x="584" y="752" class="ink" font-size="13">案例比广告有效</text>
    <text x="584" y="772" class="muted" font-size="12.5">试点转年框；交付决定续费</text>

    <rect x="1056" y="644" width="472" height="140" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <rect x="1056" y="644" width="472" height="4" fill="#B8862F"/>
    <text x="1076" y="678" class="ink" font-size="20" font-weight="700">内容 / 知识付费</text>
    <text x="1076" y="704" class="muted" font-size="12.5">选题 · 内容 · 社群 · 复购</text>
    <text x="1076" y="732" class="ink" font-size="13">先验证选题，再录课</text>
    <text x="1076" y="752" class="ink" font-size="13">一个主平台 + 邮件/社群</text>
    <text x="1076" y="772" class="muted" font-size="12.5">课程 / 会员 / 咨询复购</text>
  </g>

  <!-- section 03 loops -->
  <text x="72" y="836" class="mono muted" font-size="12" letter-spacing="2">03 / 三个循环</text>

  <g class="cn">
    <!-- loop 1 -->
    <rect x="72" y="854" width="472" height="112" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <path d="M 112 884 A 26 26 0 1 1 86 910" fill="none" stroke="#1D1B18" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="164" y="894" class="ink" font-size="18" font-weight="700">验证循环</text>
    <text x="164" y="920" class="muted" font-size="13">做 → 测 → 改</text>
    <text x="164" y="944" class="muted" font-size="12.5">每周一次真实接触，不用准备换安全感</text>

    <!-- loop 2 -->
    <rect x="564" y="854" width="472" height="112" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <path d="M 604 884 A 26 26 0 1 1 578 910" fill="none" stroke="#D9552F" stroke-width="1.4" marker-end="url(#arrowAccent)"/>
    <text x="656" y="894" class="ink" font-size="18" font-weight="700">获客循环</text>
    <text x="656" y="920" class="muted" font-size="13">内容 → 线索 → 成交 → 案例</text>
    <text x="656" y="944" class="muted" font-size="12.5">一个主渠道，跑通再复制</text>

    <!-- loop 3 -->
    <rect x="1056" y="854" width="472" height="112" rx="4" fill="#FBF7EF" stroke="#D8CCB8"/>
    <path d="M 1096 884 A 26 26 0 1 1 1070 910" fill="none" stroke="#2E6F6A" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="1148" y="894" class="ink" font-size="18" font-weight="700">复利循环</text>
    <text x="1148" y="920" class="muted" font-size="13">资产 → 更多客户 → 更多资产</text>
    <text x="1148" y="944" class="muted" font-size="12.5">内容、代码、名单、案例、关系</text>
  </g>

  <!-- section 04 assets -->
  <text x="72" y="1010" class="mono muted" font-size="12" letter-spacing="2">04 / 私有资产</text>
  <text x="72" y="1042" class="cn muted" font-size="13">平台会变，账号会封；这些才跟你走。</text>

  <g class="cn">
    <rect x="72" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
    <text x="147" y="1084" text-anchor="middle" class="ink" font-size="13">客户名单</text>
    <rect x="234" y="1060" width="150" height="36" rx="18" fill="#FBF7EF" stroke="#D8CCB8"/>
